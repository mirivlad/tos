# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "tos-residency-prototype"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Measurement-only harness for bounded verified-module residency (ADR-0071 evidence). Not a production engine."
publish = false

[features]
# Sizes the measured arena at exactly RUNTIME_GRANT, so a launch that does not
# fit fails to allocate rather than reporting a number.
grant = []

[dependencies]
tos-core = { path = "../../crates/tos-core" }
tos-ir = { path = "../../crates/tos-ir" }
tos-verifier = { path = "../../crates/tos-verifier" }
tos-runtime = { path = "../../crates/tos-runtime" }
tos-pipeline = { path = "../../crates/tos-pipeline" }
tos-hash = { path = "../../crates/tos-hash" }
tos-image-prototype = { path = "../image-prototype" }
