# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "tos-arena-bound"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Measures the implementation arena the Stage 2 pipeline needs, through the real bounded heap."
publish = false

[features]
# Sizes the measured arena at exactly RUNTIME_GRANT, so a run that does not fit
# fails to allocate rather than reporting a number.
grant = []

[dependencies]
tos-core = { path = "../../crates/tos-core" }
tos-ir = { path = "../../crates/tos-ir" }
tos-image = { path = "../../crates/tos-image" }
tos-verifier = { path = "../../crates/tos-verifier" }
tos-engine = { path = "../../crates/tos-engine" }
tos-runtime = { path = "../../crates/tos-runtime" }
tos-pipeline = { path = "../../crates/tos-pipeline" }
tos-hash = { path = "../../crates/tos-hash" }
# The capsule-backed source set, and the builder that fills one to its ceiling:
# what `--capsule` measures is a build over a boot's real source backend.
tos-capsule = { path = "../../crates/capsule", features = ["host"] }
tos-capsule-source = { path = "../../crates/tos-capsule-source" }
tos-bundle = { path = "../../crates/tos-bundle" }
