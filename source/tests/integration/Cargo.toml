[package]
name = "tos-tests-integration"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Host integration tests: golden vectors, tamper suite, determinism, perf smoke."
publish = false

[dependencies]
tos-capsule = { path = "../../crates/capsule", features = ["host"] }
tos-hash = { path = "../../crates/tos-hash" }
tos-boot-protocol = { path = "../../crates/boot-protocol" }
[dev-dependencies]
tos-core = { path = "../../crates/tos-core" }
tos-ir = { path = "../../crates/tos-ir", features = ["fixtures"] }
tos-verifier = { path = "../../crates/tos-verifier" }
tos-image = { path = "../../crates/tos-image" }
tos-engine = { path = "../../crates/tos-engine" }
tos-cache = { path = "../../crates/tos-cache" }
tos-pipeline = { path = "../../crates/tos-pipeline" }
tos-residency = { path = "../../crates/tos-residency" }
