[package]
name = "tos-tests-fuzz"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Deterministic mutation fuzz targets for the capsule and TOS Core parsers (total/bounded property)."
publish = false

[dependencies]
tos-capsule = { path = "../../crates/capsule", default-features = false }
tos-hash = { path = "../../crates/tos-hash" }
tos-core = { path = "../../crates/tos-core" }
tos-ir = { path = "../../crates/tos-ir" }
tos-verifier = { path = "../../crates/tos-verifier" }
tos-engine = { path = "../../crates/tos-engine" }