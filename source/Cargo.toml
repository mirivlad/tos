[workspace]
resolver = "2"
members = [
    "crates/tos-hash",
    "crates/tos-serial",
    "crates/tos-ir",
    "crates/tos-verifier",
    "crates/tos-image",
    "crates/tos-residency",
    "crates/tos-engine",
    "crates/tos-cache",
    "crates/tos-runtime",
    "crates/tos-frames",
    "crates/tos-launch",
    "crates/tos-core",
    "crates/tos-pipeline",
    "crates/boot-protocol",
    "crates/capsule",
    "crates/tos-capsule-source",
    "boot/uefi-loader",
    "nucleus",
    "runtime-image",
    "host-tools/capsule",
    "tests/integration",
    "tests/fuzz",
    "tests/performance",
    "tests/performance-core",
    "tests/arena-bound",
    "tests/image-prototype",
    "tests/residency",
]
# Target-only crates (UEFI / freestanding) are members but not default members:
# they are built explicitly with their target, never on the host default build.
exclude = []
default-members = [
    "crates/tos-hash",
    "crates/tos-serial",
    "crates/tos-ir",
    "crates/tos-verifier",
    "crates/tos-image",
    "crates/tos-residency",
    "crates/tos-engine",
    "crates/tos-cache",
    "crates/tos-runtime",
    "crates/tos-frames",
    "crates/tos-launch",
    "crates/tos-core",
    "crates/tos-pipeline",
    "crates/boot-protocol",
    "crates/capsule",
    "crates/tos-capsule-source",
    "host-tools/capsule",
    "tests/integration",
    "tests/performance",
    "tests/performance-core",
    "tests/arena-bound",
    "tests/image-prototype",
    "tests/residency",
]

[profile.release]
panic = "abort"
opt-level = 2
lto = true
