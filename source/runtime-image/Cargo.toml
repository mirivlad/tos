# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "tos-runtime-image"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "The TOS Core runtime as a ring-3 image: one instance per process (ADR-0048)."
publish = false

[[bin]]
name = "tos-runtime-image"
path = "src/main.rs"

[features]
# Holds the direction flag set across many timer ticks, so that the nucleus is
# entered from a process holding a flag its own handlers are compiled to assume
# is clear. Never selected by the normal runtime-image build: this is a process
# doing something legal and unusual, and only a gate has a reason to ask for it.
test-direction-flag = []
# ADR-0066's observed side: this process answers an external instrument over
# COM1 and makes no system call while it is being measured. Requires the
# nucleus built with `test-measurement-port`, which is what permits CPL 3 those
# ports.
test-measurement-port = []
# ADR-0067: the supervisor workload that creates children, ends them and
# collects what the nucleus recorded about how they ended.
test-lifecycle = []
# The second lifecycle boot: three processes, a delegated observer, and an
# ending nobody is left to collect (ADR-0067 §9a and §10).
test-lifecycle-delegate = ["test-lifecycle"]
# The third lifecycle boot: a delegated collector already blocked when a child
# of the live parent it watches ends (ADR-0067 §6).
test-lifecycle-collector = ["test-lifecycle-delegate"]
# Milestone 6 of ADR-0066: the same channel, with one exported TOS Core call
# between the markers. The frontend, verifier and engine become dependencies of
# this build alone — the production image keeps the closure it has, which is
# what the harness asserts by hashing it before and after.
test-measurement-call = [
    "test-measurement-port",
    "dep:tos-core",
    "dep:tos-ir",
    "dep:tos-engine",
    "tos-engine/measurement-marks",
    "dep:tos-verifier",
]
# ADR-0066 numerator: the real two-process request/reply path, driven one
# exchange at a time through the same COM1 marker protocol. The nucleus supplies
# the endpoint and keeps timer preemption active; this feature only selects the
# process behavior and marker permission required by the evidence boot.
test-measurement-ipc = [
    "test-measurement-port",
    "test-exchange-cost",
    "test-reply-receive",
]
# The boot whose only IPC is the exchange being measured: one process asks and
# the other answers, and neither polls, probes or delegates. `IPC_V1` §8 bounds
# crossings *per request/reply*, so a boot that also does other IPC measures a
# subtraction rather than an exchange.
test-exchange-cost = []
# The same boot with three exchanges instead of one. Two boots differing in
# nothing else are what turn a total into a slope: the crossings spent entering
# and leaving the server's loop belong to no exchange, and a difference cancels
# them.
test-more-exchanges = []
# The server answers and waits again in one operation (`endpoint_reply_receive`,
# ADR-0063) rather than in two. Selected beside either of the above.
test-reply-receive = []
# Every way that operation must refuse — each capability absent, of the wrong
# kind, or lacking its declared right, and a reply already spent — asked of a
# live reply capability, so that what follows each refusal proves nothing was
# delivered.
test-reply-receive-refusals = []

# The Region transport round (`IPC_V1` §5, §6): a worker that makes regions,
# freezes them, shares one and hands another over linearly, and a peer that is
# deliberately unable to accept the first message it is offered. Requires the
# nucleus built with `test-region-transport`, which is what decides the two
# endowments the halves are told apart by.
test-region-transport = []

# The two ways a region stops authorising an access, each in a process of its
# own: one writes an instruction into a region and jumps to it, the other reads
# a region after releasing the only handle to it. Both end in a fault, which is
# why neither shares a process with anything else. Requires the nucleus built
# with `test-region-faults`.
test-region-faults = []

[dependencies]
tos-launch = { path = "../crates/tos-launch" }
tos-pipeline = { path = "../crates/tos-pipeline" }
tos-runtime = { path = "../crates/tos-runtime" }
tos-core = { path = "../crates/tos-core", optional = true }
tos-ir = { path = "../crates/tos-ir", optional = true }
tos-engine = { path = "../crates/tos-engine", optional = true }
tos-verifier = { path = "../crates/tos-verifier", optional = true }
