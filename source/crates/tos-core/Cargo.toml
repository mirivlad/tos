[package]
name = "tos-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "TOS Core V1 reference frontend, verifier, and Bootstrap runtime."
publish = false

[lib]
name = "tos_core"

[dependencies]
tos-hash = { path = "../tos-hash" }
tos-ir = { path = "../tos-ir" }
tos-predeclared = { path = "../tos-predeclared" }

# The build script computes the linked table's digests so `src/lib.rs` can
# assert them at compile time. It reads the same crate the library links.
[build-dependencies]
tos-predeclared = { path = "../tos-predeclared" }
