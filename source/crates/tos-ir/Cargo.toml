[package]
name = "tos-ir"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "The tos-ir/v1 semantic schema: typed, verifier-visible derived representation of TOS Core source."
publish = false

[lib]
name = "tos_ir"

[features]
# The all-variants module. Data only, and off in every production build:
# a fixture that ships with the schema is one fixture, not one per consumer.
fixtures = []

[dependencies]
tos-hash = { path = "../tos-hash" }
