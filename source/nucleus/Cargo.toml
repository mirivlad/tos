[package]
name = "tos-nucleus"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "TOS Stage 1 nucleus: validates boot ABI + capsule, emits serial boot events, halts with result code."
publish = false

[[bin]]
name = "tos-nucleus"
path = "src/main.rs"

[features]
test-exception-ud2 = []
test-exception-gp = []
test-paging-unmapped = []
test-paging-readonly-text = []
test-ring3-abi = []
test-ring3-privileged = []
test-ring3-nucleus = []
# Builds a second process over the same boot module, so that the round-robin
# ADR-0049 section 4 asks for has somewhere to rotate to. The scheduler itself
# is not test-only; how many processes a canonical boot has is not this
# nucleus's decision to make (ADR-0048 section 2).
test-two-processes = []
# Endows the first process with authority over itself, so that the chain
# ADR-0055 describes — a process creating a process, bounded by what it was
# given — is exercised rather than described.
test-supervisor = []
# Isolated evidence artifact only; never selected by the normal nucleus build.
test-crypto-baseline = ["tos-capsule/test-crypto-baseline"]

[dependencies]
tos-boot-protocol = { path = "../crates/boot-protocol" }
tos-capsule = { path = "../crates/capsule", default-features = false }
tos-hash = { path = "../crates/tos-hash" }
tos-serial = { path = "../crates/tos-serial" }
tos-runtime = { path = "../crates/tos-runtime" }
tos-frames = { path = "../crates/tos-frames" }
tos-launch = { path = "../crates/tos-launch" }
