[package]
name = "tos-nucleus"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "TOS Stage 1 nucleus: validates boot ABI + capsule, emits serial boot events, halts with result code."
publish = false

[[bin]]
name = "tos-nucleus"
path = "src/main.rs"

[features]
test-exception-ud2 = []
test-exception-gp = []
test-paging-unmapped = []
test-paging-readonly-text = []
test-ring3-abi = []
test-ring3-privileged = []
test-ring3-nucleus = []
# Builds a second process over the same boot module, so that the round-robin
# ADR-0049 section 4 asks for has somewhere to rotate to. The scheduler itself
# is not test-only; how many processes a canonical boot has is not this
# nucleus's decision to make (ADR-0048 section 2).
test-two-processes = []
# Endows the first process with authority over itself, so that the chain
# ADR-0055 describes — a process creating a process, bounded by what it was
# given — is exercised rather than described.
test-supervisor = []
# ADR-0067: the boot process is endowed with create, terminate and wait_child
# over itself, which is what a supervisor is made of.
test-lifecycle = []
# Deterministic failure injection for the creation transaction, so the rollback
# is proved against real refusals rather than asserted.
test-creation-rollback = []
# Gives one process the right to receive on an endpoint nobody can send to, so
# that the state ADR-0059's liveness rule is about is a real state of a real
# system rather than a description of one.
test-deadlock = []
# One process may receive on an endpoint and another may call on it, so that
# request/reply — and the single-use reply capability `IPC_V1` §4 describes — is
# exercised rather than described.
test-call-reply = []
# A strong process and a weak one that can only ask it for things, so that the
# question `CAPABILITY_V1` §7.6 asks — does the strong one's strength leak into
# work it does for the weak one — is asked of a real pair.
test-deputy = []
# A launcher constant that asks for what `IPC_V1` §2 forbids: two processes
# receiving on one endpoint. The rule is enforced where authority is granted, so
# the only way to see it work is to ask for the thing it refuses.
test-second-receiver = []
# One process, endowed with `send` on an endpoint under the binding a TOS Core
# module requests. The module is the one that calls the system, which is the
# Stage 3 identity question docs/37 asks.
test-module-operation = []
# A grant of the wrong *kind* under the right name: authority over a process,
# bound to the name a module asks for an endpoint under. The name matches and
# the object does not, which is the one case `SYSTEM_INTERFACE_V1` §4's object
# column exists to refuse.
test-wrong-kind = []
# Authority over this process, under the name a module asks for it, carrying
# `create` and **not** `terminate`. The module's operation is then refused by the
# rights mask and the module lives to say so.
test-process-control = []
# The same authority carrying `terminate`. The module's operation then ends the
# process that made it, so the module never returns — which is the difference
# the evidence is made of.
test-process-terminate = []
# Authority over this process carrying `create`, under the name a module asks
# for it: the module is then the thing that launches a process, which is the act
# a supervisor is made of.
test-process-launch = []
# The measurement constant of ADR-0066: a TSS I/O permission bitmap whose only
# cleared bits are COM1's, so the observed process can put a marker byte on the
# wire without a system call. IOPL stays 0 and every other port faults exactly
# as it does in the production build. Never selected by the normal build.
test-measurement-port = []
# Conservative ADR-0066 floor/denominator profile: the observer calibration and
# fixed in-process call run without timer excursions. The IPC numerator never
# selects this feature and must prove preemption active.
test-measurement-no-preemption = ["test-measurement-port"]
# Isolated evidence artifact only; never selected by the normal nucleus build.
test-crypto-baseline = ["tos-capsule/test-crypto-baseline"]

[dependencies]
tos-boot-protocol = { path = "../crates/boot-protocol" }
tos-capsule = { path = "../crates/capsule", default-features = false }
tos-hash = { path = "../crates/tos-hash" }
tos-serial = { path = "../crates/tos-serial" }
tos-runtime = { path = "../crates/tos-runtime" }
tos-frames = { path = "../crates/tos-frames" }
tos-launch = { path = "../crates/tos-launch" }
