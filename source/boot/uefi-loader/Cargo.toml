[package]
name = "tos-uefi-loader"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "TOS Stage 1 UEFI loader: reads capsule + nucleus from ESP, validates, hands off via boot ABI v1."
publish = false

[[bin]]
name = "tos-uefi-loader"
path = "src/main.rs"

[dependencies]
tos-capsule = { path = "../../crates/capsule", default-features = false }
tos-boot-protocol = { path = "../../crates/boot-protocol" }
tos-hash = { path = "../../crates/tos-hash" }
tos-serial = { path = "../../crates/tos-serial" }

[features]
test-corrupt-bootinfo-identity = []
