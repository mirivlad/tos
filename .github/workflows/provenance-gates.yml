# SPDX-License-Identifier: CC-BY-SA-4.0
name: Provenance gates

# The `provenance` profile of the gate inventory in `scripts/preflight.sh`: DCO
# sign-off, SPDX headers and the provenance of embedded material — the gates
# that need the full history rather than the tip commit.
#
# The job names a profile and never a gate (ADR-0065).

on:
  pull_request:
  push:
    branches: [main, 'claude/**']

permissions:
  contents: read

concurrency:
  group: provenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      # Full history: these gates verify every commit and bind generated
      # fixtures to their historical source commits. A shallow clone would
      # silently reduce that to the tip commit — a gate that checks less than it
      # claims is worse than no gate.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repository gates — provenance profile
        run: bash scripts/preflight.sh --profile provenance
