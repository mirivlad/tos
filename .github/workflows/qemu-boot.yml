# SPDX-License-Identifier: CC-BY-SA-4.0
name: QEMU boot gate

# The Stage 1 boot evidence required by docs/30_COMPLIANCE_AND_RELEASE_GATES.md
# ("Engineering gate": QEMU suites pass) and docs/37_STAGE_IDENTITY_GATES.md
# (Stage 1: corruption and identity-mismatch tests fail closed).
#
# Kept separate from Source CI on purpose: a boot failure must read as a boot
# failure, not as a compile job that went red somewhere near the end. This job
# runs under TCG - GitHub runners have no KVM - exactly as the harness does
# locally, so no acceleration-specific behaviour is involved.

on:
  pull_request:
  push:
    branches: [main, 'claude/**']

permissions:
  contents: read

concurrency:
  group: qemu-boot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: source
    steps:
      # The capsule identity gate resolves repo-relative paths against HEAD and
      # verifies each source file with `git cat-file blob HEAD:<path>`, so the
      # commit object and its blobs must be present; checkout's default depth 1
      # provides both.
      - uses: actions/checkout@v4

      - name: Firmware and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf mtools
          qemu-system-x86_64 --version | head -1
          ls -l /usr/share/OVMF/ || true

      - name: Toolchain and targets
        run: |
          rustup target add x86_64-unknown-uefi x86_64-unknown-none
          rustc --version

      - name: Build boot artifacts
        run: |
          cargo build --release -p tos-capsule-tool
          cargo build --release -p tos-uefi-loader --target x86_64-unknown-uefi
          cargo build --release -p tos-nucleus --target x86_64-unknown-none
          cargo build --release -p tos-runtime-image --target x86_64-unknown-none

      # Success path: exit 33 (HALT_OK) plus the required boot events in order.
      # The harness decides; this step just reports its verdict.
      - name: Boot success gate
        run: bash host-tools/qemu-test/run.sh --out target/qemu-ci/success --expect 33

      # Every rejected fixture must fail closed in the loader with the rule its
      # vectors.tsv row declares.
      - name: Negative boot suite
        run: bash host-tools/qemu-test/negative-suite.sh target/qemu-ci/negative

      # ADR-0049 section 4: two runnable processes each make progress without
      # either yielding. The gate builds its own nucleus in a separate target
      # directory and checks that the production one did not change, so the
      # artifact the steps above booted is still the artifact this job produced.
      - name: Scheduler gate
        run: bash host-tools/qemu-test/scheduler.sh target/qemu-ci/scheduler

      # CAPABILITY_V1 section 7 and IPC_V1 section 9: authority is a handle a
      # process was given rather than one it can construct, and a message
      # crosses between two processes that hold one half each of one endpoint.
      - name: Capabilities and IPC gate
        run: bash host-tools/qemu-test/capabilities.sh target/qemu-ci/capabilities

      # ADR-0055: authority has a root the launcher put there, and every grant
      # after it is an attenuation of something the grantor already held. A
      # process creates a process and ends it, and the nucleus names who did.
      - name: Process authority gate
        run: bash host-tools/qemu-test/supervisor.sh target/qemu-ci/supervisor

      # ADR-0059: a wait nothing in the system can satisfy is ended, diagnosed
      # and reported. The boot this gate runs is expected to FAIL — a system
      # that stopped says so, which is the whole point of the rule.
      - name: Blocking and liveness gate
        run: bash host-tools/qemu-test/blocking.sh target/qemu-ci/blocking

      # IPC_V1 section 4: the right to answer a call is made by the nucleus for
      # that one call, given to whoever receives the request, and spent by being
      # used. Nobody is endowed with it.
      - name: Request and reply gate
        run: bash host-tools/qemu-test/request-reply.sh target/qemu-ci/request-reply

      # CAPABILITY_V1 section 7.6, which docs/37 names as the test that fails
      # quietly in systems passing the other five: a strong process acting for a
      # weak one is bounded by what the weak one gave it, not by what it holds.
      - name: Confused deputy gate
        run: bash host-tools/qemu-test/deputy.sh target/qemu-ci/deputy

      # ADR-0026 keeps q35/qemu64/TCG as the mandatory functional profile and
      # makes the exact full-path/crypto p95 ratio its performance gate. This
      # runner reuses the production boot harness and retains P2 raw evidence.
      - name: Stage 1 ADR-0026 performance conformance
        run: >
          bash host-tools/qemu-test/stage1-performance-conformance.sh
          --out target/qemu-ci/performance-adr-0026
          --evidence-status P2

      # Serial logs are the Stage 1 evidence; keep them for a failed run so the
      # failure can be diagnosed without re-running the job.
      - name: Upload boot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-boot-evidence
          path: |
            source/target/qemu-ci/**/serial.log
            source/target/qemu-ci/**/events.log
            source/target/qemu-ci/**/capsule.meta.json
            source/target/qemu-ci/*.log
            source/target/qemu-ci/performance-adr-0026/**
          if-no-files-found: warn
          retention-days: 90
