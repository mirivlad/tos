# SPDX-License-Identifier: CC-BY-SA-4.0
name: QEMU boot gate

# The `qemu` profile of the gate inventory in `scripts/preflight.sh`: the boot
# artifacts and every gate that boots them, including the ADR-0026 performance
# conformance run, whose evidence status is P2 here and P1 anywhere else —
# ADR-0040 reserves P2 for the reference platform and the harness refuses to
# emit it elsewhere.
#
# Kept separate from Source CI on purpose: a boot failure must read as a boot
# failure, not as a compile job that went red somewhere near the end. This job
# runs under TCG — GitHub runners have no KVM — exactly as the harness does
# locally, so no acceleration-specific behaviour is involved.
#
# The job names a profile and never a gate (ADR-0065); the two steps that are
# not the profile declare themselves environment in YAML.

on:
  pull_request:
  push:
    branches: [main, 'claude/**']

permissions:
  contents: read

concurrency:
  group: qemu-boot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The capsule identity gate resolves repo-relative paths against HEAD and
      # verifies each source file with `git cat-file blob HEAD:<path>`, so the
      # commit object and its blobs must be present; checkout's default depth 1
      # provides both.
      - uses: actions/checkout@v4

      # A stalled Ubuntu mirror hung this step for the job's whole budget twice
      # on 2026-08-19, so nothing that followed ran and the failure said only
      # "cancelled". The bound and the retries are not tuning: apt's default is
      # to wait indefinitely, and a step that can wait indefinitely inside a job
      # that cannot is a step that reports a timeout as a mystery.
      - name: Firmware and tools
        env:
          GATE_PARITY: environment
        timeout-minutes: 10
        run: |
          # apt's own Acquire timeouts do not cover this: the mirror accepts the
          # connection and then goes quiet, which is not a timeout to apt and is
          # indistinguishable from a slow download. So the bound is external.
          apt_get() {
            sudo timeout 150 apt-get -o Acquire::Retries=2 \
                                     -o Acquire::http::Timeout=15 \
                                     -o Acquire::https::Timeout=15 "$@"
          }
          # Refreshing the lists is best effort **and says so**. The runner image
          # ships lists that already carry these three packages, so a mirror that
          # will not answer decides how long this takes and never whether the job
          # runs at all.
          apt_get update ||
            echo "apt-get update did not finish; using the image's package lists"
          for attempt in 1 2 3; do
            apt_get install -y --no-install-recommends \
              qemu-system-x86 ovmf mtools && break
            if [ "$attempt" = 3 ]; then
              echo "the packages this gate boots on could not be installed" >&2
              exit 1
            fi
            echo "install attempt $attempt did not finish; retrying"
            sudo dpkg --configure -a || true
          done
          qemu-system-x86_64 --version | head -1
          ls -l /usr/share/OVMF/ || true

      - name: Toolchain and targets
        env:
          GATE_PARITY: environment
        working-directory: source
        run: |
          rustup target add x86_64-unknown-uefi x86_64-unknown-none
          rustc --version

      - name: Repository gates — qemu profile
        run: bash scripts/preflight.sh --profile qemu

      # Serial logs are the Stage 1 evidence; keep them for a failed run so the
      # failure can be diagnosed without re-running the job.
      - name: Upload boot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-boot-evidence
          path: |
            source/target/preflight-qemu/**/serial.log
            source/target/preflight-qemu/**/events.log
            source/target/preflight-qemu/**/capsule.meta.json
            source/target/preflight-qemu/*.log
            source/target/preflight-qemu/performance-adr-0026/**
          if-no-files-found: warn
          retention-days: 90
