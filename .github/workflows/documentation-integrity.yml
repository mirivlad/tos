name: Documentation integrity

on:
  pull_request:
  push:
    branches: [main]

jobs:
  generated-specification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check generated consolidated specification
        run: python3 tools/build-specification.py --check
      # Ordering matters: the consolidated specification is part of the release
      # package, so it must be regenerated (and verified above) before the
      # package digests are checked.
      - name: Check generated release manifest and digests
        run: python3 tools/build-release-manifest.py --check

      - name: Validate source manifest and accepted ADR coverage
        shell: python
        run: |
          from pathlib import Path
          root = Path('.')
          listed = {
              line.strip() for line in (root/'docs/SPECIFICATION_SOURCES.txt').read_text().splitlines()
              if line.strip() and not line.lstrip().startswith('#')
          }
          # Only *accepted* decisions belong in the consolidated view: a
          # Proposed ADR carries no authority, and listing one would publish it
          # as though it did. The check said "accepted" all along and compared
          # every file, which made a correct repository fail.
          def accepted(path):
              return any(
                  line.startswith('- Status:') and 'Accepted' in line
                  for line in path.read_text().splitlines()
              )
          adrs = {str(p) for p in (root/'docs/adr').glob('*.md') if accepted(p)}
          missing = sorted(adrs - listed)
          if missing:
              raise SystemExit('accepted ADRs missing from specification manifest: ' + ', '.join(missing))
