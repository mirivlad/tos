name: Documentation integrity

on:
  pull_request:
  push:
    branches: [main]

jobs:
  generated-specification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check generated consolidated specification
        run: python3 tools/build-specification.py --check
      # Ordering matters: the consolidated specification is part of the release
      # package, so it must be regenerated (and verified above) before the
      # package digests are checked.
      - name: Check generated release manifest and digests
        run: python3 tools/build-release-manifest.py --check

      # The same script the local preflight runs. This check used to live here
      # as its own inline copy, and the copy was the problem twice over: it was
      # the only place the docs/38 release check was enforced, so
      # `preflight --full` could be green while this job had been failing on
      # every push since ADR-0061 was accepted; and it classified an ADR by
      # whether the word "Accepted" appeared anywhere in its status line, which
      # is not the same question as what its status is. One implementation, two
      # callers.
      - name: Validate source manifest and accepted ADR coverage
        run: python3 scripts/check-specification-manifest.py --root .
