name: Documentation integrity

# The `docs` profile of the gate inventory in `scripts/preflight.sh`: the gates
# that need nothing but text — the generated specification, the source manifest
# and the release digests, the interface contracts and the diagnostic registry.
#
# This job names a **profile** and never a gate (ADR-0065). What is in the
# profile is decided in one place, and `scripts/check-gate-parity.py` fails if a
# profile has no job or a job runs a command that is not a profile.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  generated-specification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repository gates — docs profile
        run: bash scripts/preflight.sh --profile docs
