# SPDX-License-Identifier: CC-BY-SA-4.0
name: Source CI

# The `source` and `selftest` profiles of the gate inventory in
# `scripts/preflight.sh`: everything that needs the Rust toolchain, and the
# gates that test the gates on fixtures.
#
# The QEMU boot gate is deliberately NOT here: it needs firmware packages and a
# TCG boot, and it must be possible to see it fail on its own terms rather than
# as part of a compile job.
#
# This job names **profiles** and never gates (ADR-0065). Steps that are not a
# profile declare themselves environment in YAML — `env: GATE_PARITY:
# environment` — and `scripts/check-gate-parity.py` refuses anything else.

on:
  pull_request:
  push:
    branches: [main, 'claude/**']

permissions:
  contents: read

concurrency:
  group: source-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml lives in source/ and pins the toolchain with rustfmt
      # and clippy. rustup must be invoked from there: from the repository root
      # it resolves to the default toolchain instead and silently installs
      # targets for the wrong one.
      - name: Toolchain and targets
        env:
          GATE_PARITY: environment
        working-directory: source
        run: |
          rustup show active-toolchain
          rustup target add x86_64-unknown-uefi x86_64-unknown-none
          rustc --version
          cargo --version

      - name: Repository gates — source profile
        run: bash scripts/preflight.sh --profile source

      - name: Repository gates — selftest profile
        run: bash scripts/preflight.sh --profile selftest
